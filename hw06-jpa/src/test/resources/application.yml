spring:
  datasource:
    url: jdbc:h2:mem:testdb
  sql:
    init:
      mode: always
  liquibase:
    enabled: true
    contexts: test
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
  shell:
    interactive:
      enabled: false
  test:
    database:
      replace: none