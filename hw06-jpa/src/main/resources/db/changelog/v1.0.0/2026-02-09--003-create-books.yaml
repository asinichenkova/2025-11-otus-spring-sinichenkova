databaseChangeLog:
  - changeSet:
      id: 2026-02-09--003-create-books
      author: alsinichenkova
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: books
      changes:
        - tagDatabase:
            tag: v1.0.0
        - createTable:
            tableName: books
            remarks: "Книги"
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  remarks: "Идентификатор книги"
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(255)
                  remarks: "Наименование жанра"
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: BIGINT
                  remarks: "Код автора"
                  constraints:
                    nullable: false
                    foreignKeyName: books_authors_fk
                    references: authors(id)
                    onDelete: cascade
              - column:
                  name: genre_id
                  type: BIGINT
                  remarks: "Код жанра"
                  constraints:
                    nullable: false
                    foreignKeyName: books_genres_fk
                    references: genres(id)
                    onDelete: cascade
      rollback: